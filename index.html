<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="K.G.T. Public Security Organization — Internal Management System. Authorized Personnel Only." />
  <title>K.G.T. | Public Security Organization</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/login.css" />
  <link rel="stylesheet" href="/src/css/dashboard.css" />
  <link rel="stylesheet" href="/src/css/spreadsheet.css" />
  <link rel="stylesheet" href="/src/css/coding.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/cipher.css" />
</head>
<body>


  <!-- ═══ MAIN APPLICATION ═══ -->
  <div id="app-page" class="page active">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="/logo.png" alt="KGT" class="sidebar-logo" />
        <div class="sidebar-brand">
          <span class="brand-title">K.G.T.</span>
          <span class="brand-sub">Internal System</span>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-title">NAVIGATION</span>
          <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-page="coding" id="nav-coding">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Coding System</span>
          </button>
        </div>

        <div class="nav-section">
          <span class="nav-section-title">SHEETS</span>
          <div id="sheet-nav-list" class="sheet-nav-list">
            <!-- Dynamically populated -->
          </div>
          <button id="add-sheet-btn" class="nav-item add-sheet-btn" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Sheet</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <span class="user-name" id="user-name">Admin</span>
            <span class="user-role" id="user-role">Administrator</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="page-title" class="page-title">Dashboard</h2>
          <span id="page-subtitle" class="page-subtitle">Personnel Management</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-stat" id="total-stat">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="total-count">0</span>
          </div>
          <div class="topbar-auth">
            <button id="header-login-btn" class="header-auth-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              LOGIN 🔒
            </button>
          </div>
        </div>
      </header>

      <!-- Dashboard View -->
      <div id="dashboard-view" class="content-view active">
        <div class="spreadsheet-toolbar" id="spreadsheet-toolbar" style="display:none;">
          <button id="add-row-btn" class="toolbar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Row
          </button>
          <button id="add-section-btn" class="toolbar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Section
          </button>
        </div>
        <div class="spreadsheet-container" id="spreadsheet-container">
          <div class="spreadsheet-empty">
            <img src="/logo.png" alt="KGT" class="empty-logo" />
            <p>Select a sheet from the sidebar to view data</p>
          </div>
        </div>
      </div>

      <!-- Coding System View -->
      <div id="coding-view" class="content-view">
        <div class="coding-toolbar" id="coding-toolbar" style="display:none;">
          <button id="add-category-btn" class="toolbar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Category
          </button>
        </div>
        <div class="coding-search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="code-search" placeholder="Search codes..." />
        </div>
        <div id="coding-container" class="coding-container"></div>
      </div>
    </main>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal-overlay" class="modal-overlay">
    <div id="auth-modal" class="modal">
      <div class="modal-header">
        <h3 id="auth-modal-title">Admin Authentication</h3>
        <button id="auth-modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body auth-modal-body">
        <form id="auth-login-form" autocomplete="off">
          <div class="form-group">
            <label for="auth-username">USERNAME</label>
            <input type="text" id="auth-username" name="username" placeholder="Enter your username" required />
          </div>
          <div class="form-group">
            <label for="auth-password">PASSWORD</label>
            <input type="password" id="auth-password" name="password" placeholder="Enter your password" required />
          </div>
          <div id="auth-login-error" class="login-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="auth-modal-cancel" class="modal-btn secondary">Cancel</button>
        <button id="auth-modal-confirm" class="modal-btn primary">Authenticate</button>
      </div>
    </div>
  </div>

  <!-- Regular Modals -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="modal-btn secondary">Cancel</button>
        <button id="modal-confirm" class="modal-btn primary">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
